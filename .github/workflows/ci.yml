name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace:
    name: Typecheck, lint and test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: orgni
          POSTGRES_PASSWORD: orgni
          POSTGRES_DB: orgni
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orgni"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgres://orgni:orgni@localhost:5432/orgni

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare pnpm@10 --activate

      # The end-to-end tests drive the real Python Document Intelligence
      # service, so its dependencies must be present. Tesseract backs OCR.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install OCR system dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr poppler-utils

      - name: Install Python dependencies
        run: |
          pip install -r intelligence/document-intelligence/requirements.txt
          pip install -r intelligence/organizational-ontology/requirements.txt

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Migrate DB schema (for persistence integration tests)
        run: pnpm --filter @workspace/db run migrate

      - name: Typecheck
        run: pnpm run typecheck

      # Scoped to the document pipeline. The repo-wide `pnpm run lint` currently
      # reports ~142 pre-existing failures (including generated code in
      # lib/api-zod), so gating on it would make CI red on arrival. Widen this
      # once that debt is cleared.
      - name: Lint (document pipeline)
        run: >
          npx prettier --check
          "apps/worker/src/envelope/**/*.ts"
          "apps/worker/src/ingestion/pipeline.ts"
          "apps/worker/src/phase1/**/*.ts"
          "apps/worker/src/document-intelligence/**/*.ts"
          "apps/worker/src/pipeline.ts"
          "apps/worker/tests/**/*.ts"
          "apps/api/src/routes/**/*.ts"
          "apps/api/src/lib/auth.ts"
          "apps/api/src/lib/authenticate.ts"
          "apps/api/tests/**/*.ts"
          "apps/web/src/lib/api.ts"
          "apps/web/src/lib/auth.tsx"
          "apps/web/src/pages/login.tsx"
          "apps/web/src/pages/console.tsx"

      - name: Test
        run: pnpm run test

      - name: Document service tests
        working-directory: intelligence/document-intelligence
        run: python -m pytest -q

      # The ontology integration tests run the REAL tokenizer (Node) against the
      # REAL ontology (Python), so both runtimes must be present (they are).
      - name: Ontology tests (real tokenizer → real ontology)
        working-directory: intelligence/organizational-ontology
        run: python -m pytest -q

  docker:
    name: Build images
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f infrastructure/docker/api.Dockerfile -t orgni-api .

      - name: Build worker image
        run: docker build -f infrastructure/docker/worker.Dockerfile -t orgni-worker .

      - name: Build document service image
        run: docker build -f infrastructure/docker/document-intelligence.Dockerfile -t orgni-document-intelligence .

      - name: Build ontology image
        run: docker build -f infrastructure/docker/organizational-ontology.Dockerfile -t orgni-ontology .
