# Local full-platform stack — the complete Phase 1 pipeline on your laptop:
#   web (dev) + API + worker + document-intelligence + ontology + Postgres + Redis
#
# Run from the repo root:
#   docker compose -f infrastructure/docker/docker-compose.yml up --build
#
# Then upload a document:
#   curl -X POST http://localhost:8080/api/documents \
#     -H "X-Tenant-Id: tenant_demo" -F "file=@invoice.pdf"
#   curl http://localhost:8080/api/documents -H "X-Tenant-Id: tenant_demo"
#
# The web service is dev-only (Vite dev server); in production the frontend is a
# static build on Vercel, never a container.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: orgni
      POSTGRES_PASSWORD: orgni_dev_password # local-only; never used in cloud environments
      POSTGRES_DB: orgni
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orgni"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: create/upgrade the database schema, then exit. The API waits for
  # this to complete before starting so it never queries missing tables.
  migrate:
    image: node:24-alpine
    working_dir: /repo
    command: sh -c "corepack enable && pnpm install --frozen-lockfile=false && pnpm --filter @workspace/db run migrate"
    environment:
      DATABASE_URL: postgres://orgni:orgni_dev_password@postgres:5432/orgni
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../..:/repo
      - repo-node-modules:/repo/node_modules

  document-intelligence:
    build:
      context: ../..
      dockerfile: infrastructure/docker/document-intelligence.Dockerfile
    environment:
      PORT: "8000"
    ports:
      - "8000:8000"

  ontology:
    build:
      context: ../..
      dockerfile: infrastructure/docker/organizational-ontology.Dockerfile
    environment:
      PORT: "8100"
    ports:
      - "8100:8100"

  api:
    build:
      context: ../..
      dockerfile: infrastructure/docker/api.Dockerfile
    environment:
      NODE_ENV: production
      PORT: "8080"
      DATABASE_URL: postgres://orgni:orgni_dev_password@postgres:5432/orgni
      DOCUMENT_INTELLIGENCE_URL: http://document-intelligence:8000
      ONTOLOGY_URL: http://ontology:8100
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      document-intelligence:
        condition: service_started
      ontology:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  worker:
    build:
      context: ../..
      dockerfile: infrastructure/docker/worker.Dockerfile
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://orgni:orgni_dev_password@postgres:5432/orgni
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    image: node:24-alpine
    working_dir: /repo
    command: sh -c "corepack enable && pnpm install && pnpm --filter @workspace/web run dev"
    environment:
      PORT: "5000"
      VITE_API_URL: http://localhost:8080
    ports:
      - "5000:5000"
    volumes:
      - ../..:/repo
      - web-node-modules:/repo/node_modules

volumes:
  postgres-data:
  web-node-modules:
  repo-node-modules:
